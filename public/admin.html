<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>البتراء · الاستقبال</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141A33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 124'%3E%3Cg fill='%232A3FA8'%3E%3Cpath d='M4 27 60 3l56 24-6 5L60 12 10 32z'/%3E%3Crect x='10' y='40' width='14' height='76'/%3E%3Crect x='96' y='40' width='14' height='76'/%3E%3Crect x='42' y='36' width='14' height='80'/%3E%3Cpath d='M56 36h12a19 19 0 0 1 0 38H56v-10h12a9 9 0 0 0 0-18H56z'/%3E%3Crect x='24' y='86' width='72' height='9'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=Marcellus&display=swap">
<style>
/* Layout concept: the front desk ledger — a night-blue sidebar like the hotel's courtyard at night,
   a calm paper work surface, and state encoded in colour chips so the desk reads at a glance. */
:root{
  --bg:#F1EFEA; --panel:#FFFFFF; --panel-2:#F7F5F0; --hover:#EFECE5;
  --ink:#151A31; --ink-2:#3B4060; --muted:#72708A; --line:#E3DED3; --line-2:#EDE9E1;
  --ultra:#2A3FA8; --ultra-2:#3D55D1; --ultra-soft:#E4E8FB; --ultra-ink:#23348C;
  --brass:#B9772F; --brass-soft:#F7EAD8;
  --side:#121731; --side-2:#1B2144; --side-ink:#E9EBF7; --side-muted:#8E93B8;
  --ok:#23845A; --ok-soft:#DDF2E7; --warn:#B26B00; --warn-soft:#FCEBCC; --bad:#B8303F; --bad-soft:#F9E0E3; --info:#2A6FB0; --info-soft:#DDEBF8;
  --occ:#2A3FA8; --occ-soft:#DCE2FB; --arr:#B9772F; --dep:#7A3FB0; --dep-soft:#EFE3FA; --ooo:#8A8797;
  --shadow:0 1px 2px rgba(21,26,49,.05),0 8px 24px -14px rgba(21,26,49,.18);
  --f-display:"Reem Kufi","Alexandria",system-ui,sans-serif;
  --f-body:"Alexandria",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-latin:"Marcellus","Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1024; --panel:#151A33; --panel-2:#1A2040; --hover:#212852;
  --ink:#ECEEF8; --ink-2:#C4C8E2; --muted:#8C91B4; --line:#262D55; --line-2:#1F2548;
  --ultra:#7B8FF0; --ultra-2:#95A6F5; --ultra-soft:#232C63; --ultra-ink:#B7C3FA;
  --brass:#E0A460; --brass-soft:#3A2C1C;
  --side:#080B1A; --side-2:#12173A; --side-ink:#E9EBF7; --side-muted:#7E84AB;
  --ok:#4CC08A; --ok-soft:#133526; --warn:#E8A33A; --warn-soft:#3A2A10; --bad:#F07384; --bad-soft:#3D1820; --info:#6FB0EC; --info-soft:#15304B;
  --occ:#6F84EE; --occ-soft:#222C66; --arr:#E0A460; --dep:#B98AF0; --dep-soft:#2E2150; --ooo:#6B6985;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1024; --panel:#151A33; --panel-2:#1A2040; --hover:#212852;
  --ink:#ECEEF8; --ink-2:#C4C8E2; --muted:#8C91B4; --line:#262D55; --line-2:#1F2548;
  --ultra:#7B8FF0; --ultra-2:#95A6F5; --ultra-soft:#232C63; --ultra-ink:#B7C3FA;
  --brass:#E0A460; --brass-soft:#3A2C1C;
  --side:#080B1A; --side-2:#12173A; --side-ink:#E9EBF7; --side-muted:#7E84AB;
  --ok:#4CC08A; --ok-soft:#133526; --warn:#E8A33A; --warn-soft:#3A2A10; --bad:#F07384; --bad-soft:#3D1820; --info:#6FB0EC; --info-soft:#15304B;
  --occ:#6F84EE; --occ-soft:#222C66; --arr:#E0A460; --dep:#B98AF0; --dep-soft:#2E2150; --ooo:#6B6985;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ultra)}
:focus-visible{outline:2px solid var(--ultra);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;line-height:1.3;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.num,.tn{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr;background:var(--side)}
.login-art{position:relative;overflow:hidden}
.login-art video,.login-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.login-art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,11,26,.9),rgba(8,11,26,.2))}
.login-art .cap{position:absolute;bottom:40px;inset-inline:40px;z-index:2;color:#fff}
.login-art .cap b{font-family:var(--f-display);font-size:44px;display:block;line-height:1.1}
.login-side{display:grid;place-items:center;padding:32px 20px;background:var(--bg)}
.login-card{width:min(400px,100%);display:grid;gap:16px}
.login-card .logo{width:54px;height:56px;color:var(--ultra)}
.demo-creds{background:var(--brass-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;display:grid;gap:6px}
.demo-creds button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.side-brand{display:flex;gap:12px;align-items:center;padding:20px 18px 16px;color:#fff;text-decoration:none}
.side-brand svg{width:34px;height:36px}
.side-brand b{font-family:var(--f-display);font-size:21px;line-height:1}
.side-brand small{display:block;font-family:var(--f-latin);font-size:10px;letter-spacing:.3em;color:var(--side-muted);margin-top:3px}
.ablaq{height:8px;background:repeating-linear-gradient(to bottom,#23222B 0 2px,#FFFDF8 2px 4px);opacity:.9}
.side nav{display:grid;gap:2px;padding:12px 10px}
.side .grp{font-size:11.5px;color:var(--side-muted);padding:14px 12px 4px;letter-spacing:.04em}
.nav-a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-size:14.5px;position:relative}
.nav-a:hover{background:var(--side-2)}
.nav-a.on{background:var(--side-2);color:#fff}
.nav-a.on::before{content:"";position:absolute;inset-inline-start:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brass)}
.nav-a .cnt{margin-inline-start:auto;background:var(--brass);color:#1a1206;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.nav-a .cnt.b{background:#E0485C;color:#fff}
.side-foot{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brass);color:#1a1206;display:grid;place-items:center;font-weight:700;flex:none}
.side-foot .who{min-width:0;flex:1}
.side-foot .who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:12px;color:var(--side-muted)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:inherit;position:relative}
.icon-btn:hover{background:var(--hover)}
.side .icon-btn:hover{background:var(--side-2)}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px;padding:12px 24px}
.bar h1{font-size:21px}
.bar .date{color:var(--muted);font-size:13.5px}
.search{margin-inline-start:auto;position:relative;width:min(360px,40vw)}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 38px 9px 14px}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-res{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:50;padding:6px}
.sr-item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.sr-item:hover,.sr-item.act{background:var(--hover)}
.bell-dot{position:absolute;top:6px;inset-inline-end:6px;min-width:17px;height:17px;border-radius:9px;background:#E0485C;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu-toggle{display:none}
.view{padding:22px 24px 60px;display:grid;gap:18px;align-content:start;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
.preview-note{background:var(--brass-soft);color:var(--ink);font-size:13px;padding:7px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:16px}
.card-h .sp{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--ultra);color:#fff}
:root[data-theme="dark"] .btn-p{color:#0C1024}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-p{color:#0C1024}}
.btn-p:hover{background:var(--ultra-2)}
.btn-s{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn-s:hover{background:var(--hover)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad-soft);color:var(--bad)}
.btn-bad:hover{background:var(--bad);color:#fff}
.btn-wa{background:#1FA855;color:#fff}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-pending{background:var(--warn-soft);color:var(--warn)}
.s-confirmed{background:var(--info-soft);color:var(--info)}
.s-in_house{background:var(--ok-soft);color:var(--ok)}
.s-checked_out{background:var(--line-2);color:var(--muted)}
.s-cancelled,.s-no_show{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:4px;width:fit-content;max-width:100%}
.tabs button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs .c{font-size:11.5px;opacity:.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ultra-soft);border-color:var(--ultra);color:var(--ultra-ink)}
.fld{display:grid;gap:5px;min-width:0}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.in:focus{outline:0;border-color:var(--ultra);box-shadow:0 0 0 3px var(--ultra-soft)}
textarea.in{min-height:70px;resize:vertical}
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(-16px)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty svg{width:40px;height:40px;opacity:.5}

/* tables */
.tbl-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;position:sticky;top:0;background:var(--panel)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel-2)}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
.gname{font-weight:600}
.sub{font-size:12px;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:grid;gap:4px;position:relative;overflow:hidden}
.kpi .k{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:clamp(19px,1.9vw,28px);white-space:nowrap;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;font-family:var(--f-body)}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ultra);border-radius:3px}

/* lists (arrivals etc) */
.lst{display:grid}
.lst.scroll{max-height:430px;overflow:auto}
.li{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--panel-2)}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn{min-width:46px;height:34px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.rn.none{color:var(--muted);font-weight:500;font-size:12px}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible;direction:ltr}
.chart .grid-l{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar-r{fill:var(--occ)}
.chart .bar-r.today{fill:var(--brass)}
.chart .bar-r:hover,.chart .hit:hover+.bar-r{opacity:.8}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(50%,-110%);z-index:5;box-shadow:var(--shadow)}
.hbar{display:grid;grid-template-columns:120px 1fr 80px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.hbar .t{height:12px;border-radius:0 4px 4px 0;background:var(--line-2);overflow:hidden}
[dir="rtl"] .hbar .t{border-radius:4px 0 0 4px}
.hbar .t i{display:block;height:100%;background:var(--ultra);border-radius:4px}
.hbar .n{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}

/* room rack */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:6px;vertical-align:-2px}
.floor{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start}
.floor-l{font-family:var(--f-display);font-size:13px;color:var(--muted);padding-top:12px;text-align:center}
.floor-l b{display:block;font-size:22px;color:var(--ink);line-height:1}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.rt{border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:8px 10px;min-height:84px;display:flex;flex-direction:column;gap:2px;text-align:start;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s}
.rt:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rt .no{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.rt .ty{font-size:11.5px;color:var(--muted)}
.rt .gn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.rt .hk{width:9px;height:9px;border-radius:50%}
.rt.occ{background:var(--occ-soft);border-color:transparent}
.rt.occ .no{color:var(--ultra-ink)}
.rt.arr{border:2px dashed var(--arr)}
.rt.dep::after{content:"مغادرة";position:absolute;top:0;inset-inline-end:0;background:var(--dep);color:#fff;font-size:10.5px;padding:1px 7px;border-end-start-radius:8px}
.rt.ooo{background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--line-2) 6px 12px);color:var(--muted)}
.hk-clean{background:var(--ok)}.hk-dirty{background:var(--warn)}.hk-inspect{background:var(--info)}.hk-ooo{background:var(--ooo)}

/* timeline */
.tl-wrap{overflow:auto;max-height:calc(100vh - 210px);border-radius:0 0 16px 16px}
.tl{display:grid;position:relative;min-width:max-content}
.tl-h{position:sticky;top:0;z-index:4;background:var(--panel);font-size:11.5px;text-align:center;border-bottom:1px solid var(--line);padding:6px 0;color:var(--muted);line-height:1.3}
.tl-h b{display:block;color:var(--ink);font-size:14px}
.tl-h.today{background:var(--ultra-soft);color:var(--ultra-ink)}
.tl-h.wk{background:var(--panel-2)}
.tl-rl{position:sticky;inset-inline-start:0;z-index:3;background:var(--panel);border-inline-end:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.tl-rl b{font-variant-numeric:tabular-nums}
.tl-corner{position:sticky;top:0;inset-inline-start:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.tl-c{border-bottom:1px solid var(--line-2);border-inline-start:1px solid var(--line-2);height:40px}
.tl-c.today{background:color-mix(in srgb,var(--ultra-soft) 45%,transparent)}
.tl-c.drop{background:var(--ultra-soft)}
.tl-fl{background:var(--panel-2);font-size:12px;color:var(--muted);padding:4px 10px;position:sticky;inset-inline-start:0;grid-column:1/-1;border-bottom:1px solid var(--line-2);font-weight:600}
.tl-b{position:absolute;height:30px;border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:grab;z-index:2;box-shadow:0 0 0 2px var(--panel);color:#fff}
.tl-b:active{cursor:grabbing}
.tl-b.st-pending{background:var(--warn)}.tl-b.st-confirmed{background:var(--info)}.tl-b.st-in_house{background:var(--ok)}.tl-b.st-checked_out{background:var(--ooo)}
:root[data-theme="dark"] .tl-b{color:#0C1024}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl-b{color:#0C1024}}
.tl-b small{font-weight:400;opacity:.85}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,10,24,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(640px,100%);background:var(--bg);z-index:80;transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.3)}
.drawer.on{transform:none}
.dr-h{padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.dr-h h2{font-size:19px}
.dr-b{overflow:auto;padding:18px 20px 30px;display:grid;gap:14px;align-content:start;flex:1}
.dr-f{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:90;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.modal-c{background:var(--bg);border-radius:18px;width:min(880px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.modal-c.sm{width:min(460px,100%)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.sec-t{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.folio-l{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:center}
.folio-l:last-child{border-bottom:0}
.folio-t{display:flex;justify-content:space-between;padding:10px 0 0;font-weight:700;font-size:16px}
.bal{border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.bal.due{background:var(--bad-soft);color:var(--bad)}
.bal.paid{background:var(--ok-soft);color:var(--ok)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.hist{display:grid;gap:8px;font-size:13px}
.hist div{display:flex;gap:10px}
.hist i{width:8px;height:8px;border-radius:50%;background:var(--ultra);margin-top:7px;flex:none}
.type-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tp{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);text-align:start;display:grid;gap:2px}
.tp[aria-pressed="true"]{border-color:var(--ultra);box-shadow:0 0 0 3px var(--ultra-soft)}
.tp[disabled]{opacity:.45}
.tp b{font-size:14px}
.room-pick{display:flex;gap:6px;flex-wrap:wrap}
.room-pick button{min-width:54px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.room-pick button[aria-pressed="true"]{background:var(--ultra);color:#fff;border-color:var(--ultra)}
.room-pick button .hk{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-start:5px;vertical-align:1px}
.suggest{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.suggest div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.suggest div:hover{background:var(--hover)}

/* notifications */
.notif{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:min(380px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:60;max-height:460px;overflow:auto}
.notif .n-i{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;cursor:pointer;font-size:13.5px}
.notif .n-i:hover{background:var(--panel-2)}
.notif .n-i.unread{background:var(--ultra-soft)}
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;z-index:120;display:grid;gap:8px;max-width:min(380px,calc(100vw - 40px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);font-size:14px;animation:tin .3s ease both;display:flex;gap:10px;align-items:flex-start}
.toast.err{background:var(--bad);color:#fff}
.toast.new{background:var(--brass);color:#1a1206;cursor:pointer}
.toast b{display:block}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

/* invoice */
.invoice{background:#fff;color:#151A31;border-radius:6px;padding:36px;font-size:13.5px;display:grid;gap:18px}
.invoice h2{font-family:var(--f-display);font-size:24px}
.invoice table th{background:#fff;color:#555}
.invoice td{border-color:#eee}
.inv-h{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:3px double #23222B;padding-bottom:14px}
.inv-h svg{width:46px;height:48px;color:#2A3FA8}

@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.g-dash,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;right:0;width:260px;z-index:100;transform:translateX(105%);transition:transform .3s}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .menu-toggle{display:grid}
  .bar{padding:10px 14px}
  .bar .date{display:none}
  .search{width:auto;flex:1}
  .view{padding:16px 14px 60px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{flex-wrap:wrap}
  .search{order:5;flex-basis:100%;width:100%}
  #newBtn span{display:none}
  .li{flex-wrap:wrap}
  .li .mid{flex-basis:55%}
  .login{grid-template-columns:1fr}
  .login-art{display:none}
}
@media print{
  body{background:#fff}
  .app>.side,.bar,.preview-note,.no-print,.toasts,.scrim{display:none!important}
  .app{display:block}
  .modal{position:static;opacity:1;display:block;padding:0}
  .modal-c{box-shadow:none;max-height:none;width:100%}
  body.printing-invoice .main{display:none}
  body.printing-invoice .drawer{display:none}
  body.printing-report .drawer,body.printing-report .modal{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
